name: CI

# Compila y prueba el proyecto en cada push y en cada pull request.
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot) - pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ejecutar pruebas unitarias
        run: mvn -B test

  frontend:
    name: Frontend (Angular) - compilacion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  paquete:
    name: Empaquetar aplicacion (JAR)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar el frontend dentro de src/main/resources/static
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generar el JAR
        run: mvn -B package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: kasero-jar
          path: target/*.jar
          if-no-files-found: error
