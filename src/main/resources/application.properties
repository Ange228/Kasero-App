spring.application.name=kasero-altiplano
server.port=8080

# --- Supabase (PostgreSQL) ---
# Las credenciales NO van en el codigo: se leen de variables de entorno.
# Ver docs/SUPABASE.md para obtenerlas.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# El esquema y los datos iniciales se aplican con scripts SQL idempotentes
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=false
